# Publishes the approved chatbot router to Google Cloud Artifact Registry (vigil-md-models,
# package chatbot-query-router) after it passes the tests and the model gate.
#
#   1. tests          the chatbot unit tests (no GCP)
#   2. gate           retrain the router from this commit; compare with the champion in git
#                     (query_router/champion_metrics.json). Worse safety or accuracy fails here.
#   3. publish        query_router/publish.py uploads the model only if its test numbers equal the
#                     approved champion's; a version that already exists is skipped.
#
# Runs on pushes to model-dev-integration that touch the chatbot, or by hand (Actions ->
# chatbot-publish -> Run workflow). GCP access is keyless (Workload Identity Federation): the
# service account can only write to the vigil-md-models repository. Until the repository variables
# GCP_WIF_PROVIDER and GCP_PUBLISH_SA are set, steps 1 and 2 run and step 3 is skipped.
# GitHub e-mails the person who pushed when a run fails.
name: chatbot-publish

on:
  push:
    branches: [model-dev-integration]
    paths:
      - "Model-Development/chatbot/**"
      - ".github/workflows/chatbot-publish.yml"
  workflow_dispatch:

concurrency:
  group: chatbot-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: Model-Development/chatbot

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write          # lets the job ask GCP for a short-lived token (no stored key)
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Model-Development/chatbot/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the tests
        run: pytest -q -rs

      # MLflow writes to the runner's temp folder (outside the checkout, so publish.py sees a
      # clean tree); the store is kept below as the run's "mlflow-ci" artifact.
      - name: Retrain the router and run the model gate
        env:
          MLFLOW_TRACKING_URI: sqlite:///${{ runner.temp }}/mlflow-ci/mlflow.db
          VIGIL_MLFLOW_ARTIFACTS: ${{ runner.temp }}/mlflow-ci/artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/mlflow-ci"
          python -m query_router.generate
          python -m query_router.train
          python -m query_router.gate --candidate models/baseline --regression-only

      - name: Keep this run's MLflow record (training run, model version, metrics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-ci
          path: ${{ runner.temp }}/mlflow-ci
          retention-days: 90
          if-no-files-found: warn

      - name: Check it is the approved champion (no upload)
        run: python -m query_router.publish --model-dir models/baseline --print-only

      - name: Say why nothing is published
        if: vars.GCP_WIF_PROVIDER == '' || vars.GCP_PUBLISH_SA == ''
        run: |
          msg="Not published: repository variables GCP_WIF_PROVIDER and GCP_PUBLISH_SA are not set (Settings -> Secrets and variables -> Actions -> Variables)."
          echo "::warning::$msg"
          echo "**$msg**" >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate to GCP (Workload Identity Federation)
        if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_PUBLISH_SA != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PUBLISH_SA }}

      - name: Set up gcloud
        if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_PUBLISH_SA != ''
        uses: google-github-actions/setup-gcloud@v2

      - name: Publish to Artifact Registry
        if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_PUBLISH_SA != ''
        run: |
          python -m query_router.publish --model-dir models/baseline
          { echo '### Published versions of chatbot-query-router'; echo '```';
            python -m query_router.publish --list; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
