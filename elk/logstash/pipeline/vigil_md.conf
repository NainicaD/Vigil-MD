input {
  # Receives structured JSON logs from Python scripts via TCP
  tcp {
    port => 5044
    codec => json_lines
    tags => ["python_script"]
  }

  # Receives logs from Filebeat (Airflow task logs)
  beats {
    port => 5045
    tags => ["airflow"]
  }
}

filter {
  # Parse Airflow log lines
  if "airflow" in [tags] {
    grok {
      match => {
        "message" => "\[%{TIMESTAMP_ISO8601:log_timestamp}\] %{LOGLEVEL:log_level} - %{GREEDYDATA:log_message}"
      }
      tag_on_failure => ["_grok_parse_failure"]
    }

    # Extract DAG info from file path
    grok {
      match => {
        "[log][file][path]" => "dag_id=%{DATA:dag_id}/run_id=%{DATA:run_id}/task_id=%{DATA:task_id}"
      }
      tag_on_failure => []
    }

    mutate {
      add_field => { "log_source" => "airflow" }
    }
  }

  # Python script logs already arrive as structured JSON
  if "python_script" in [tags] {
    mutate {
      add_field => { "log_source" => "python_script" }
    }
  }

  # Parse timestamp
  date {
    match => ["log_timestamp", "ISO8601"]
    target => "@timestamp"
    remove_field => ["log_timestamp"]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "vigil-md-logs-%{+YYYY.MM.dd}"
  }

  # Also print to Logstash stdout for debugging
  stdout {
    codec => rubydebug
  }
}