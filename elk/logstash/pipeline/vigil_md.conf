input {
  # Receives structured JSON logs from Python scripts via TCP
  tcp {
    port => 5044
    codec => json_lines
    tags => ["python_script"]
  }

  # Receives logs from Filebeat (Airflow task logs)
  beats {
    port => 5045
    tags => ["airflow"]
  }
}

filter {
  if "airflow" in [tags] {
    # Airflow 3 writes one JSON object per log line
    json {
      source => "message"
      target => "airflow"
      tag_on_failure => ["_jsonparsefailure"]
    }

    if "_jsonparsefailure" in [tags] {
      # Fallback for any old plain-text Airflow log lines
      grok {
        match => {
          "message" => "\[%{TIMESTAMP_ISO8601:log_timestamp}\] %{LOGLEVEL:log_level} - %{GREEDYDATA:log_message}"
        }
        tag_on_failure => ["_grok_parse_failure"]
      }
    } else {
      # Copy the useful JSON keys to simple top-level fields
      mutate {
        copy => {
          "[airflow][timestamp]" => "log_timestamp"
          "[airflow][level]"     => "log_level"
          "[airflow][event]"     => "log_message"
          "[airflow][logger]"    => "logger"
        }
      }

      # Pull out the exception type and message when a task fails
      if [airflow][error_detail][0][exc_type] {
        mutate {
          copy => {
            "[airflow][error_detail][0][exc_type]"  => "error_type"
            "[airflow][error_detail][0][exc_value]" => "error_message"
          }
        }
      }

      # The full traceback stays in "message"; drop the nested copy to keep the index simple
      mutate { remove_field => ["[airflow][error_detail]"] }
    }

    mutate { uppercase => ["log_level"] }

    # DAG, run, task and attempt from the file path (present on every line)
    grok {
      match => {
        "[log][file][path]" => "dag_id=%{DATA:dag_id}/run_id=%{DATA:run_id}/task_id=%{DATA:task_id}/attempt=%{INT:attempt}"
      }
      tag_on_failure => []
    }

    mutate {
      add_field => { "log_source" => "airflow" }
    }
  }

  # Python script logs already arrive as structured JSON
  if "python_script" in [tags] {
    mutate {
      add_field => { "log_source" => "python_script" }
    }
  }

  # Use the time the event happened, not the time Logstash received it
  if [log_timestamp] {
    date {
      match => ["log_timestamp", "ISO8601"]
      target => "@timestamp"
      remove_field => ["log_timestamp"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "vigil-md-logs-%{+YYYY.MM.dd}"
  }

  # Also print to Logstash stdout for debugging
  stdout {
    codec => rubydebug
  }
}