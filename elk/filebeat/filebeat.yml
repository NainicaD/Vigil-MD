filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /airflow-logs/dag_id=*/**/*.log
    fields:
      source: airflow
    fields_under_root: true
    # No multiline: Airflow 3 writes one JSON object per line,
    # and tracebacks are already inside that JSON.

filebeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: false

output.logstash:
  hosts: ["logstash:5045"]

logging.level: info